[project]
name = "vent-voice"
version = "0.1.0"
description = "Local Kokoro-82M + Chatterbox-Turbo voice-clone (MLX) TTS server for VENT - OpenAI-compatible /v1/audio/speech"
requires-python = ">=3.12,<3.13"
dependencies = [
    "mlx-audio>=0.5.7",
    "misaki[en]>=0.9.4",
    "en-core-web-sm @ https://github.com/explosion/spacy-models/releases/download/en_core_web_sm-3.8.0/en_core_web_sm-3.8.0-py3-none-any.whl",
    "fastapi>=0.115",
    "uvicorn>=0.30",
    "numpy",
    "soundfile",
    "pip",
]

[tool.uv]
package = false
